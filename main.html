<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neural Ants Simulation</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <aside class="sidebar">
            <h1>Neural Ants</h1>
            
            <div class="control-group">
                <label for="antCountInput">Starting ants</label>
                <input type="number" id="antCountInput" value="20" min="1" max="100">
            </div>

            <details open>
                <summary>Simulation Settings</summary>
                <div class="settings-grid">
                    <label>Max ants <input type="number" id="maxAntsInput" value="50" min="1"></label>
                    <label>Food spawn <input type="number" id="foodSpawnInput" value="0.05" step="0.01" min="0" max="1"></label>
                    <label>Max food <input type="number" id="maxFoodInput" value="100" min="1"></label>
                    <label>Initial food <input type="number" id="initialFoodInput" value="30" min="0"></label>
                    <label>Repro energy <input type="number" id="reproEnergyInput" value="120" min="1"></label>
                    <label>Repro cost <input type="number" id="reproCostInput" value="40" min="0"></label>
                    <label>Energy decay <input type="number" id="energyDecayInput" value="0.1" step="0.01" min="0"></label>
                    <label>Food gain <input type="number" id="foodEnergyInput" value="30" min="0"></label>
                    <label>Pher decay <input type="number" id="pheromoneDecayInput" value="0.005" step="0.001" min="0" max="1"></label>
                    <label>Pher cell <input type="number" id="pheromoneCellSizeInput" value="10" min="5"></label>
                    <label>Obstacles <input type="number" id="obstacleCountInput" value="8" min="0"></label>
                    <label>Width <input type="number" id="widthInput" value="800" min="100"></label>
                    <label>Height <input type="number" id="heightInput" value="600" min="100"></label>
                </div>
            </details>

            <div class="actions">
                <button id="startBtn" class="primary-btn">Start Simulation</button>
                <button id="stopBtn" class="secondary-btn" disabled>Pause</button>
            </div>

            <div class="viz-container">
                <h2>Brain Activity</h2>
                <canvas id="networkCanvas" width="280" height="150"></canvas>
            </div>
        </aside>

        <main class="simulation-area">
            <div id="stats" class="stats-bar"></div>
            <div class="canvas-wrapper">
                <canvas id="simulationCanvas" width="800" height="600"></canvas>
            </div>
        </main>
    </div>

    <script type="module" src="js/main.js"></script>
</body>
</html>
